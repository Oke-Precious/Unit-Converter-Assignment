<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unit Converter</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div class="container">
        <h1>Special Unit Converter</h1>

        <!-- Temperature Converter -->
        <div class="converter-card">
            <h2>Temperature</h2>
            <div class="converter-inputs">
                <div class="input-group">
                    <label for="celsius">Celsius (°C)</label>
                    <input type="number" class="converter-input" oninput="convertCelsius()" id="enterCelsius" placeholder="0">
                </div>

                <div class="separator">↔ </div>

                <div class="input-group">
                    <label for="fahrenheit">Fahrenheit (°F)</label>
                    <input type="number" class="converter-input" oninput="convertFahrenheit()" id="enterFahrenheit" placeholder="32">
                </div>
            </div>
        </div>

        <!-- Distance Converter -->
        <div class="converter-card">
            <h2>Distance</h2>
            <div class="converter-inputs">
                <div class="input-group">
                    <label for="kilometers">Kilometers (km)</label>
                    <input type="number" class="converter-input" oninput="convertKilometers()" id="enterKilometers" placeholder="0" >
                </div>

                <div class="separator">↔</div>

                <div class="input-group">
                    <label for="miles">Miles (mi)</label>
                    <input type="number" class="converter-input" oninput="convertMiles()" id="enterMiles" placeholder="0" >
                </div>
            </div>
        </div>
    </div>
</body>

<script src="script.js"></script>
</html>
